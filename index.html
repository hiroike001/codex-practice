<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>codex-practice</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #20242a;
      line-height: 1.7;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 24px;
    }
    .panel {
      background: #ffffff;
      border: 1px solid #dfe3ea;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(25, 31, 40, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 36px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 16px;
      font-size: 18px;
    }
    .status {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #e7f6ed;
      color: #166534;
      font-weight: 700;
    }
    ol {
      padding-left: 24px;
      margin-bottom: 0;
    }
    code {
      background: #eef1f5;
      padding: 2px 6px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>codex-practice</h1>
      <p>このページが見えていれば、プロジェクトのファイルがちゃんと入っています。</p>
      <p class="status">GitHubから取り込めたら成功</p>

      <h2>次にやること</h2>
      <ol>
        <li>GitHub Desktopで <code>Fetch origin</code> を押す</li>
        <li><code>Pull origin</code> が出たら押す</li>
        <li><code>Show in Finder</code> を押す</li>
        <li><code>index.html</code> をダブルクリックする</li>
      </ol>
    </section>
  </main>
</body>
</html>
